<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0A0F1A;
        font-family: Inter, "Segoe UI", sans-serif;
      }
      #cuerpo {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 26px;
      }
      #num {
        font-size: 26px; font-weight: 800; letter-spacing: 0.42em;
        color: #C07C41; text-transform: uppercase;
      }
      #tit {
        font-size: 92px; font-weight: 900; letter-spacing: -2.5px;
        color: #FFFFFF; text-align: center; max-width: 1400px; line-height: 1.05;
      }
      #sub {
        font-size: 34px; font-weight: 400; color: #B4BAC5;
        text-align: center; max-width: 1150px; line-height: 1.4;
      }
      #barra {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 300px; width: 0; height: 5px; background: #C07C41; border-radius: 3px;
      }
      #marca {
        position: absolute; left: 0; right: 0; bottom: 74px;
        text-align: center; color: #C07C41;
        font-size: 22px; font-weight: 700; letter-spacing: 0.62em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="3.6"
      data-width="1920"
      data-height="1080"
    >
      <div id="cuerpo">
        <div id="num"></div>
        <div id="tit"></div>
        <div id="sub"></div>
      </div>
      <div id="barra"></div>
      <div id="marca">VAKDOR</div>
    </div>

    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      document.getElementById("num").textContent = v.kicker ?? "";
      document.getElementById("tit").textContent = v.titulo ?? "PRISMA";
      document.getElementById("sub").textContent = v.bajada ?? "";

      const tl = gsap.timeline({ paused: true });
      tl.from("#num", { opacity: 0, y: 18, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.from("#tit", { opacity: 0, y: 34, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.from("#sub", { opacity: 0, y: 22, duration: 0.55, ease: "power3.out" }, 0.45);
      tl.to("#barra", { width: 420, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.from("#marca", { opacity: 0, duration: 0.5 }, 0.7);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
