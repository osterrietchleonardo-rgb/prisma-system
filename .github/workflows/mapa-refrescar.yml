name: PRISMA Mapa · recalcular precio por m2

# Lo que el mapa muestra sale de dos lugares distintos:
#   - los PINES se leen de la base en vivo, asi que una propiedad nueva aparece sola;
#   - los COLORES y el ranking de barrios estan precalculados, y sin este recalculo se
#     quedan con los numeros del dia que se cargaron.
#
# Corre despues del sync de la red, no antes: recalcular sobre datos viejos no sirve.
#
# POR QUE UN SCRIPT CONTRA LA BASE Y NO UN curl AL ENDPOINT DE LA APP
# Hasta el 21/8/2026 este workflow le pegaba a /api/cron/mapa-refrescar y fallaba TODAS
# las noches (10 de 10 corridas desde que se creo: nunca funciono ni un dia). El motivo
# de fondo es que ese camino tiene dos topes que este trabajo no puede respetar: el rol
# de PostgREST rechaza los DELETE sin WHERE y ademas corta a los 8 segundos. El recalculo
# medido tarda unos 40 segundos. Ocho segundos es un limite pensado para que una pantalla
# no se cuelgue, no para recalcular 90.000 celdas.
# El detalle completo esta arriba de scripts/refrescar-mapa.mjs.

on:
  schedule:
    # Todos los dias a las 08:00 UTC (05:00 en Argentina), despues de los syncs de la
    # madrugada y antes de que alguien abra el mapa a la manana.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refrescar:
    runs-on: ubuntu-latest
    # El recalculo completo ronda los 40 segundos. 10 minutos es margen de sobra para un
    # dia en que la base este cargada.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Armar el .env que lee el script
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > .env
          echo "SUPABASE_API_KEY_MANAGEMENT=${{ secrets.SUPABASE_API_KEY_MANAGEMENT }}" >> .env

      - name: Recalcular barrios, cuadricula y manzanas
        # El script termina en error si falla cualquiera de los tres pasos, e imprime cual
        # y por que. Un cron que "termina bien" habiendo fallado deja los precios viejos
        # sin que nadie se entere.
        run: node scripts/refrescar-mapa.mjs
