# Descubrimiento diario de mercado_avisos: captura lo publicado en TODO CABA
# (filterLocation "Capital Federal", barrido A) y lo embebe. El cron de Actions
# se atrasa horas — es esperado y no importa para la cobertura: la ventana es
# "el día anterior entero + lo que va de hoy", así que corra cuando corra no
# pierde nada.
#
# PERO LA HORA SÍ IMPORTA PARA EL BOLSILLO. Apify cobra por aviso devuelto y la
# ventana incluye lo que va de hoy, que mañana se vuelve a pagar. Medido el
# 8-sep con la corrida de las 11:19 de la mañana: 1.182 avisos del día anterior
# + 315 del propio día; esos 315 se pagaron dos veces. Corriendo a la medianoche
# argentina esa repetición baja a casi nada: ~US$ 10 por mes.
#
# La ventana ya no se escribe acá: la calcula el script (piso 2, techo 3 cuando
# faltó una corrida). El plan de gasto completo está en mercado-sync/plan.mjs.
#
# Secrets que necesita: APIFY_API_KEY, NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY.

name: mercado-descubrimiento

on:
  schedule:
    - cron: '30 3 * * *'   # 00:30 en Argentina (el cron se atrasa: cuanto más temprano arranque, menos se repite)
  workflow_dispatch: {}

jobs:
  descubrir:
    runs-on: ubuntu-latest
    # 90 min: la corrida de CABA con --max 1500 tarda 10-13 min en Apify (medido
    # 5..12-sep) + descarga de ~145 MB + loader + Don Torcuato + embeddings.
    # Con 30 min el job moría justo cuando el actor estaba por terminar.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Todo CABA en una sola corrida: filterLocation "Capital Federal" trae lo
      # publicado en cualquier barrio de la ciudad (verificado 4-sep: 48 items de
      # ~48 barrios distintos). --zona caba no tiene centroide → el loader saca el
      # barrio del propio aviso y saltea el geo-check (que igual cubre el refresco
      # mensual por-barrio).
      #
      # --max 1800: CABA publica 1277-1543 avisos/día (medido 8..12-sep). La ventana
      # real de --dentro-de 2 es "ayer entero + lo que va de hoy" ≈ 1500-1600, no dos
      # días enteros, así que el tope NO encarece la corrida (se paga por item
      # devuelto): solo deja de cortar. Con 1500 el 11-sep perdimos 87 avisos.
      - name: Descubrimiento CABA (todos los barrios, todos los tipos)
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node mercado-sync/descubrimiento.mjs --location "Capital Federal" --zona caba --max 1800 --tope-usd 90
      # Zonas fuera de CABA: el filtro "Capital Federal" no las ve, van como paso propio.
      # `continue-on-error`: una falla acá no debe frenar los embeddings de CABA.
      # --zona con centroide en loader.mjs → lo que caiga fuera de la localidad va a cuarentena.
      - name: Descubrimiento Don Torcuato (terrenos)
        continue-on-error: true
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node mercado-sync/descubrimiento.mjs --location "Don Torcuato" --zona don-torcuato --tipo-prop terrenos --max 200 --tope-usd 90
      - name: Embeddings de lo nuevo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node mercado-sync/embeddings.mjs --lote 60
