# Descubrimiento diario de mercado_avisos: captura lo publicado en TODO CABA
# (filterLocation "Capital Federal", barrido A, centavos por corrida) y lo
# embebe. El cron de Actions se atrasa horas — es esperado y no importa: el
# filtro es "publicado en los últimos 2 días", así que corra cuando corra no
# pierde nada, y el solape lo cubre el refresco mensual.
#
# Secrets que necesita: APIFY_API_KEY, NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY.

name: mercado-descubrimiento

on:
  schedule:
    - cron: '0 10 * * *'   # ~7:00 Argentina (se atrasa; da igual, ver arriba)
  workflow_dispatch: {}

jobs:
  descubrir:
    runs-on: ubuntu-latest
    # 90 min: la corrida de CABA con --max 1500 tarda 10-13 min en Apify (medido
    # 5..12-sep) + descarga de ~145 MB + loader + Don Torcuato + embeddings.
    # Con 30 min el job moría justo cuando el actor estaba por terminar.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Todo CABA en una sola corrida: filterLocation "Capital Federal" trae lo
      # publicado en cualquier barrio de la ciudad (verificado 4-sep: 48 items de
      # ~48 barrios distintos). --zona caba no tiene centroide → el loader saca el
      # barrio del propio aviso y saltea el geo-check (que igual cubre el refresco
      # mensual por-barrio). --max alto para no truncar un día real de CABA.
      - name: Descubrimiento CABA (todos los barrios, todos los tipos)
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node mercado-sync/descubrimiento.mjs --location "Capital Federal" --zona caba --dentro-de 2 --max 1500
      # Zonas fuera de CABA: el filtro "Capital Federal" no las ve, van como paso propio.
      # `continue-on-error`: una falla acá no debe frenar los embeddings de CABA.
      # --zona con centroide en loader.mjs → lo que caiga fuera de la localidad va a cuarentena.
      - name: Descubrimiento Don Torcuato (terrenos)
        continue-on-error: true
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node mercado-sync/descubrimiento.mjs --location "Don Torcuato" --zona don-torcuato --tipo-prop terrenos --dentro-de 2 --max 200
      - name: Embeddings de lo nuevo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node mercado-sync/embeddings.mjs --lote 60
