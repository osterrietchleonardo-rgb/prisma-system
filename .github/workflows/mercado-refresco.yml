# Refresco mensual de mercado_avisos (barrido B) + verificación de bajas (C).
#
# Por zona: relee el inventario completo con --tanda 30 (precios, republicaciones,
# altas que el descubrimiento se perdió) y después verifica los avisos que el
# refresco no vio — el ÚNICO camino que marca 'caido'. Al final, embeddings de lo
# nuevo. NO pasa --ckpt: siempre relee todo desde la página 1, sin saltear.
#
# QUÉ ZONAS CORREN ESTE MES lo decide `mercado-sync/plan.mjs` (con sus tests), no
# una lista escrita acá. Releer las 48 zonas todos los meses costaba ~US$ 67 y,
# sumado al descubrimiento diario (~US$ 42), no entraba en el plan de US$ 100.
# Ahora la ciudad va en DOS TURNOS parejos: cada mes se relee la mitad (~US$ 33),
# así que todo CABA queda al día cada 2 meses y ningún barrio queda afuera.
#
# max-parallel 3: el plan de Apify permite 5 corridas simultáneas y el
# descubrimiento diario también necesita lugar. Cada zona es un job propio con su
# timeout de 350 min; con tanda 30 hasta la más grande entra con margen.
# PRESUPUESTO: --tope-usd 70 frena el refresco si el mes ya lleva US$ 70, para
# dejarle lugar al descubrimiento diario (que tiene su propio freno en 90).

name: mercado-refresco

on:
  schedule:
    - cron: '0 6 3 * *'    # día 3 de cada mes (el cron se atrasa; da igual)
  workflow_dispatch: {}

jobs:
  # Le pregunta al plan qué zonas le tocan a este mes y arma la matriz con eso.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matriz: ${{ steps.calcular.outputs.matriz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Qué zonas corren este mes
        id: calcular
        run: |
          node mercado-sync/matriz.mjs --humano
          node mercado-sync/matriz.mjs >> "$GITHUB_OUTPUT"

  refrescar:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matriz) }}
    env:
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `refrescar: false` es el caso de `otros-sin-zona`: los barrios que ZonaProp
      # escribe fuera de las 48 zonas (Barrio Norte, Once, Congreso, Centro…) y
      # los avisos que vinieron sin barrio. No hay búsqueda que los traiga, pero
      # sus avisos existen y hay que verificar si siguen vivos.
      - name: Refresco ${{ matrix.zona }}
        if: ${{ matrix.refrescar }}
        run: node mercado-sync/barrido.mjs --base ${{ matrix.base }} --desde 1 --hasta ${{ matrix.hasta }} --tanda 30 --zona ${{ matrix.zona }} --tope-usd 70
      - name: Verificación de bajas ${{ matrix.zona }}
        run: node mercado-sync/verificacion.mjs --zona ${{ matrix.zona }} --dias 25 --max 500

  embeddings:
    needs: refrescar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Embeddings de lo nuevo
        run: node mercado-sync/embeddings.mjs --lote 40
